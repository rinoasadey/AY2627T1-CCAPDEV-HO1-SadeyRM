		<section id="contact-form">
        	<h2> contact form </h2>
        	<p> this form does not store data yet ૮(˶ㅠ︿ㅠ)ა stay tuned! </p>
            	<form action="#" method="get">

                    	preferred way to connect: <br>
                    	<input type="radio" id="email-choice" name="contact-method" value="email">
                    	<label for="email-choice"> email </label>
                    	<input type="radio" id="linkedin-choice" name="contact-method" value="linkedin">
                    	<label for="linkedin-choice"> linkedin </label>
                	</p>

                	<p>
                    	<label for="message"> message: </label><br>
                    	<textarea id="message" name="message" rows="7" cols="50">hi rinoa! </textarea>
                	</p>
